<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="utf-8">
  <title>Test Cases for the Arabic MathJax Extension (v4)</title>

  <link href="//fonts.googleapis.com/css?family=Amiri&amp;subset=arabic" rel="stylesheet" type="text/css">
  <link href="testcases.css" rel="stylesheet" type="text/css">

  <!-- The Arabic extension's stylesheet (the .mfliph mirror + .mar Arabic font). -->
  <link href="../dist/arabic.css" rel="stylesheet" type="text/css">

  <!--
    MathJax v4 configuration. The Arabic extension is loaded as a component from
    ../dist and added to the TeX packages. The equations use a handful of stock
    packages (color, enclose, ...) that MathJax autoloads on demand.
  -->
  <script>
    window.MathJax = {
      loader: {
        load: ['[tex]/ams', '[tex]/color', '[tex]/enclose', '[tex]/cases', '[arabic]/arabic.min.js'],
        paths: { arabic: '../dist' }
      },
      tex: {
        packages: { '[+]': ['ams', 'color', 'enclose', 'cases', 'arabic'] },
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      }
    };
  </script>
  <!-- MathJax v4 (served locally from node_modules; swap for a CDN if preferred). -->
  <script id="MathJax-script" async src="../node_modules/mathjax/tex-chtml.js"></script>

  <!-- Libraries used to build the equations table from testcases.yml. -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/mustache.js/4.2.0/mustache.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="render-equations.js"></script>
</head>

<body>
  <div id="wrapper">
    <div id="equations"></div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      renderEquations();
    });
  </script>
</body>

</html>
